<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>簡諧運動互動模擬</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
<h1>簡諧運動（SHM）互動模擬</h1>
<p class="sub">水平彈簧振子：回復力 F = −kx。用滑桿或輸入框調整參數（輸入框沒有上限），也可直接拖曳橘色物塊。</p>

<div class="card">
<canvas id="sim" aria-label="彈簧振子動畫"></canvas>
<div class="leg"><span><i style="background:var(--vel)"></i>速度 v</span><span><i style="background:var(--force)"></i>回復力 F</span></div>
</div>

<div class="card">
<canvas id="gr" aria-label="位移與速度對時間圖"></canvas>
<div class="leg"><span><i style="background:var(--mass)"></i>位移 x（÷A）</span><span><i style="background:var(--vel)"></i>速度 v（÷Aω）</span><span><i style="background:var(--spring)"></i>能量 E（÷E₀，下方長條）</span></div>
</div>

<div class="card">
<div class="btns"><button id="pp">暫停</button><button id="rs" class="alt">重設</button></div>
<div class="ctl">
<label>質量 m（kg）<input class="num" id="mN" type="number" min="0.01" step="0.1" value="1"><input id="m" type="range" min="0.2" max="5" step="0.1" value="1"></label>
<label>彈力常數 k（N/m）<input class="num" id="kN" type="number" min="0.1" step="1" value="40"><input id="k" type="range" min="5" max="100" step="1" value="40"></label>
<label>振幅 A（m）<input class="num" id="aN" type="number" min="0.01" step="0.01" value="0.3"><input id="a" type="range" min="0.05" max="0.5" step="0.01" value="0.3"></label>
<label>阻尼 c（N·s/m）<input class="num" id="cN" type="number" min="0" step="0.05" value="0"><input id="c" type="range" min="0" max="3" step="0.05" value="0"></label>
</div>
</div>

<div class="card read">
<div><span>週期 T = 2π√(m/k)</span><strong id="rT"></strong></div>
<div><span>頻率 f</span><strong id="rf"></strong></div>
<div><span>角頻率 ω</span><strong id="rw"></strong></div>
<div><span>位移 x</span><strong id="rx"></strong></div>
<div><span>速度 v</span><strong id="rv"></strong></div>
<div><span>動能 / 位能</span><strong id="re"></strong></div>
</div>
<p class="note" id="note"></p>
</main>

<button id="aiBtn" aria-label="開啟 AI 助教">AI</button>
<div id="aiWin" role="dialog" aria-label="AI 助教">
<div id="aiHead"><span>AI 助教・簡諧運動</span><button id="aiX" class="alt" aria-label="關閉">×</button></div>
<div id="aiMsgs"><div class="mg a">在下方輸入 SHM 的問題，按「複製並開啟 ChatGPT」，會把問題連同目前的模擬參數一起帶到 ChatGPT 網站。若沒有自動帶入，直接在輸入框貼上即可（已複製）。</div></div>
<div id="aiForm"><textarea id="aiIn" rows="2" placeholder="輸入你的問題"></textarea><button id="aiGo">複製並開啟 ChatGPT</button><button id="aiCopy" class="alt">只複製</button></div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
